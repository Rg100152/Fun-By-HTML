<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Form - Fun By HTML</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)),
                        url('https://images.unsplash.com/photo-1502082553048-f009c37129b9?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .form-container {
            background: #0d1117; padding: 40px; border-radius: 10px; width: 100%; max-width: 600px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5); border: 1px solid #333; border-top: 5px solid #ff8c00;
        }
        .form-container h2 { text-align: center; color: #ff8c00; margin-bottom: 30px; font-size: 28px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; color: #ccc; margin-bottom: 8px; font-size: 14px; }
        .input-group input, .input-group select {
            width: 100%; padding: 12px; background: #1e1e2f; border: 1px solid #333; border-radius: 5px;
            color: white; outline: none; font-size: 15px; transition: 0.3s;
        }
        .input-group input:focus, .input-group select:focus { border-color: #ff8c00; }
        .btn-submit {
            width: 100%; padding: 14px; background: #ff8c00; color: white; border: none; border-radius: 5px;
            font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s;
        }
        .btn-submit:hover { background: #e67e00; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #aaa; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: white; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>🎓 Examination Form 2026</h2>
        <form action="{{ url_for('submit_exam') }}" method="POST">
            <div class="input-group">
                <label>Student Name</label>
                <input type="text" name="name" placeholder="Enter your full name" required>
            </div>
            <div class="input-group">
                <label>Roll Number / Student ID</label>
                <input type="text" name="roll" placeholder="Enter your roll no" required>
            </div>
            <div class="input-group">
                <label>Course</label>
                <select name="course" required>
                    <option value="ADCA (Advance Diploma in Computer Application)">ADCA (Advance Diploma in Computer Application)</option>
                    <option value="DCA (Diploma in Computer Application)">DCA (Diploma in Computer Application)</option>
                    <option value="HTML & CSS Master">HTML &amp; CSS Master</option>
                    <option value="JavaScript Basics">JavaScript Basics</option>
                </select>
            </div>
            <div class="input-group">
                <label>Date of Birth</label>
                <input type="date" name="dob" required>
            </div>
            <button type="submit" class="btn-submit">Submit &amp; Generate Marksheet</button>
        </form>
        <a href="{{ url_for('home') }}" class="back-link">← Back to Home</a>
    </div>
</body>
</html>
